[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ouro-spotify-playlist-export"
version = "0.1.0"
description = "Export Spotify playlists and Liked Songs to a local inventory and transferable playlist packs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ouro" }]
dependencies = [
  "httpx>=0.27",
  "questionary>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ouro-spe = "ouro_spe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ouro_spe"]

[tool.hatch.build.targets.wheel.sources]
"src/ouro_spe" = "ouro_spe"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
